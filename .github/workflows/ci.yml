name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('CI for PR #{0}', github.event.pull_request.number) || 'CI for main' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: Linux checks
          - os: macos-latest
            check: macOS checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Pinned release tools
        run: |
          sh scripts/ci-tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Formatting, scripts, workflows and release config
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)"
          shellcheck install.sh scripts/*.sh
          actionlint
          goreleaser check
      - name: Third-party notices are current
        if: runner.os == 'Linux'
        run: go run ./scripts/notices | cmp - THIRD_PARTY_NOTICES
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Dead code
        if: runner.os == 'Linux'
        run: sh scripts/deadcode.sh
      - name: Build a release and install it with the real installer
        run: |
          goreleaser release --snapshot --clean
          sh install.sh --from dist --version 0.0.0 --bin-dir "$RUNNER_TEMP/bin" --skills-dir "$RUNNER_TEMP/skills"
          test "$("$RUNNER_TEMP/bin/flowd" --version)" = "flowd 0.0.0"
      - name: Known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
