name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('CI for PR #{0}', github.event.pull_request.number) || 'CI for main' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: Linux checks
          - os: macos-latest
            check: macOS checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Pinned distribution tools
        run: |
          sh scripts/ci-tools.sh "$RUNNER_TEMP/flowd-tools"
          echo "$RUNNER_TEMP/flowd-tools" >> "$GITHUB_PATH"
          echo "FLOWD_GORELEASER=$RUNNER_TEMP/flowd-tools/goreleaser" >> "$GITHUB_ENV"
      - name: Distribution lint and configuration
        if: runner.os == 'Linux'
        run: |
          shellcheck install.sh scripts/*.sh
          actionlint
          goreleaser check
      - name: Record native environment
        run: |
          uname -sm
          go version
          go env GOOS GOARCH
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal tests scripts)"
      - name: Tests
        run: go test ./... -count=1
      - name: Race checks
        run: go test -race ./... -count=1
      - name: Known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
